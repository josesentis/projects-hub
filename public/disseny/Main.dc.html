<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Avui</title>
<script src="../assets/dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B2320}a:hover{color:#C9502F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6EFE8; color: #2B2320; font-family: 'Bricolage Grotesque', system-ui, sans-serif">

  <div style="padding: 58px 24px 0; display: flex; flex-direction: column; gap: 26px">

    <header style="display: flex; justify-content: space-between; align-items: flex-start">
      <div>
        <p style="margin: 0; font-size: 15px; color: #6F6058; letter-spacing: 0.01em">Dijous, 1 d’octubre</p>
        <h1 style="margin: 4px 0 0; font-size: 44px; line-height: 1; font-weight: 750; letter-spacing: -0.03em">Avui</h1>
      </div>
      <a href="#" aria-label="Perfil" style="width: 44px; height: 44px; border-radius: 50%; background: #EADFD4; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 650; font-size: 16px">J</a>
    </header>

    <nav aria-label="Aquesta setmana" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="font-size: 12px; color: {{d.labelColor}}; font-weight: {{d.labelWeight}}">{{d.label}}</span>
          <span style="width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; {{d.style}}">{{d.n}}</span>
        </div>
      </sc-for>
    </nav>

    <section aria-label="Sessió d’avui" style="background: #F2B8A0; border-radius: 30px; padding: 24px 24px 22px; display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden">
      <div style="position: absolute; right: -50px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: #F6C9B4"></div>
      <div style="position: relative; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: #7A3A26">Et toca</span>
        <h2 style="margin: 0; font-size: 40px; line-height: 1; font-weight: 780; letter-spacing: -0.03em">Lower A</h2>
        <p style="margin: 2px 0 0; font-size: 15px; color: #5A3529">6 exercicis · 55 min · cames i glutis</p>
      </div>
      <div style="position: relative; display: flex; align-items: center; gap: 12px">
        <a href="Log.dc.html" style="flex-grow: 1; height: 56px; border-radius: 28px; background: #2B2320; color: #FFFAF5; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 17px; font-weight: 650">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
          Ja l’he fet
        </a>
        <a href="#" aria-label="Veure exercicis" style="width: 56px; height: 56px; border-radius: 50%; background: #FFFAF5; display: flex; align-items: center; justify-content: center; text-decoration: none">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2320" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </a>
      </div>
    </section>

    <section aria-label="Progrés de la setmana" style="display: flex; align-items: center; gap: 18px; padding: 0 4px">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true" style="flex-shrink: 0; transform: rotate(-90deg)">
        <circle cx="26" cy="26" r="21" fill="none" stroke="#E6DBD0" stroke-width="6"/>
        <circle cx="26" cy="26" r="21" fill="none" stroke="#5E8A6C" stroke-width="6" stroke-linecap="round" stroke-dasharray="66 132"/>
      </svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 22px; font-weight: 720; letter-spacing: -0.02em">2 de 4 sessions</span>
        <span style="font-size: 14px; color: #6F6058">143 min · 908 kcal aquesta setmana</span>
      </div>
    </section>

    <section aria-label="Una altra cosa" style="display: flex; flex-direction: column; gap: 12px">
      <h3 style="margin: 0; font-size: 17px; font-weight: 650">Avui fas una altra cosa?</h3>
      <div style="display: flex; gap: 10px; overflow: hidden; margin-right: -24px">
        <a href="Log.dc.html" style="flex-shrink: 0; height: 48px; padding: 0 18px; border-radius: 24px; background: #FFFAF5; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 550">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9502F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Avançar Full Body</a>
        <a href="#" style="flex-shrink: 0; height: 48px; padding: 0 18px; border-radius: 24px; background: #FFFAF5; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 550">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9502F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M7 21l3-6 3 2v5M10 15l-2-4 4-3 3 3h3"/></svg>Córrer 36 min</a>
        <a href="#" style="flex-shrink: 0; height: 48px; padding: 0 18px; border-radius: 24px; background: #FFFAF5; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 550">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9502F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Avui descanso</a>
      </div>
    </section>
  </div>

  <a href="Coach.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 98px; height: 56px; border-radius: 28px; background: #FFFAF5; box-shadow: 0 10px 30px rgba(91, 52, 36, 0.12); display: flex; align-items: center; gap: 12px; padding: 0 8px 0 10px; text-decoration: none">
    <span style="width: 38px; height: 38px; border-radius: 50%; background: #E2674A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #FFFAF5; opacity: 0.85"></span>
    </span>
    <span style="flex-grow: 1; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 19px; color: #6F6058">Explica’m com estàs…</span>
    <span style="width: 40px; height: 40px; border-radius: 50%; background: #2B2320; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFAF5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </span>
  </a>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 10px 28px 26px; box-sizing: border-box; background: #F6EFE8; display: flex; justify-content: space-between; align-items: flex-start">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 650; color: #2B2320">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#2B2320" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>Avui</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; color: #6F6058">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6F6058" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg>Programa</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; color: #6F6058">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6F6058" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/></svg>Progrés</a>
    <a href="Coach.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; color: #6F6058">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6F6058" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Coach</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['Dl', 'Dt', 'Dc', 'Dj', 'Dv', 'Ds', 'Dg'];
    const nums = [28, 29, 30, 1, 2, 3, 4];
    const kinds = ['done', 'rest', 'done', 'today', 'planned', 'rest', 'planned'];
    const styles = {
      done: 'background: #E2674A; color: #FFFAF5',
      rest: 'background: transparent; color: #A39388',
      today: 'background: #2B2320; color: #FFFAF5',
      planned: 'background: transparent; color: #2B2320; box-shadow: inset 0 0 0 1.5px #CDBDB0',
    };
    return {
      days: labels.map((label, i) => ({
        label, n: nums[i], style: styles[kinds[i]],
        labelColor: kinds[i] === 'today' ? '#2B2320' : '#6F6058',
        labelWeight: kinds[i] === 'today' ? 700 : 500,
      })),
    };
  }
}
</script>
</body>
</html>
